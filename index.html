<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Tanya ✨</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 20px;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    /* Paso 1: Fecha y hora */
    .time {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 1.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.2s forwards;
    }
    /* Paso 2: Mensaje */
    .msg {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.8s forwards;
    }
    /* Paso 3: Kaomoji */
    .kao {
      font-size: 1.8rem;
      color: #ec4899;
      display: inline-block;
      opacity: 0;
      animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.5s forwards, float 2.5s ease-in-out infinite 2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.3); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="time" id="clock"></div>
    <div class="msg">
      Hola Tanya, te queremos mucho...bueno lo suficiente para que me importe que estés viva...ten un excelente y maravilloso día, nunca olvides que sos bien chingona y estás bien chingada jajajajaja... Te quiere A
    </div>
    <div class="kao">⊂⁠(⁠･⁠ω⁠･⁠*⁠⊂⁠)</div>
  </div>
  <script>
    document.getElementById('clock').innerText = new Date().toLocaleString('es-ES', {
      dateStyle: 'medium',
      timeStyle: 'short'
    });
  </script>
</body>
</html>
